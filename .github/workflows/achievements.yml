name: Update achievements card

on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC
  workflow_dispatch:        # run it by hand from the Actions tab

permissions:
  contents: write           # needed to commit the card

concurrency:
  group: achievements-card
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Shahnawaz75/github-achievements-progress@v0.1.0
        with:
          output: achievements.svg
          dark-output: achievements-dark.svg
